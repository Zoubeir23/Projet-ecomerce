# REDIRECTION - Le vrai docker-compose.yml est dans docker/docker-compose.ymlversion: '3.8'

# 

# Les fichiers Docker ont été réorganisés dans le dossier docker/services:

#   # Base de données PostgreSQL

# Pour démarrer les services Docker :  db:

# 1. Utiliser : docker.bat start (script de redirection automatique)    image: postgres:15-alpine

# 2. Ou aller dans docker/ et utiliser : docker-compose up    container_name: ecommerce_db

#    environment:

# Structure organisée :      POSTGRES_DB: ecommerce_db

#   docker/      POSTGRES_USER: ecommerce_user

#   ├── docker-compose.yml  ← Vrai fichier de configuration      POSTGRES_PASSWORD: ecommerce_password

#   ├── .env.docker         ← Variables d'environnement    volumes:

#   └── README.md           ← Documentation Docker      - postgres_data:/var/lib/postgresql/data

#    ports:

# ERREUR : Ce fichier n'est qu'une redirection !      - "5432:5432"

# Veuillez utiliser : cd docker && docker-compose up    networks:

      - ecommerce_network

version: '3.8'

services:  # Redis pour le cache et les sessions

  redirection:  redis:

    image: alpine:latest    image: redis:7-alpine

    command: >    container_name: ecommerce_redis

      sh -c "    ports:

      echo '❌ ERREUR : Fichier de redirection !';      - "6379:6379"

      echo '';    volumes:

      echo '📁 Les fichiers Docker sont maintenant dans docker/';      - redis_data:/data

      echo '';    networks:

      echo '✅ Utiliser à la place :';      - ecommerce_network

      echo '   docker.bat start';

      echo '   ou';  # Backend Django

      echo '   cd docker && docker-compose up';  backend:

      echo '';    build: 

      exit 1      context: ./backend

      "      dockerfile: Dockerfile
    container_name: ecommerce_backend
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://ecommerce_user:ecommerce_password@db:5432/ecommerce_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - /app/myenv  # Exclure le virtualenv du volume mount
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - ecommerce_network
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Exclure node_modules du volume mount
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true  # Pour le hot reload sur Windows
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - ecommerce_network
    stdin_open: true
    tty: true

  # Adminer pour l'administration de la base de données (optionnel)
  adminer:
    image: adminer:latest
    container_name: ecommerce_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - ecommerce_network

volumes:
  postgres_data:
  redis_data:

networks:
  ecommerce_network:
    driver: bridge