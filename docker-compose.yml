version: '3.8'

services:
  # Base de données PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: ecommerce_db
    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ecommerce_network

  # Redis pour le cache et les sessions
  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce_network

  # Backend Django
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce_backend
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://ecommerce_user:ecommerce_password@db:5432/ecommerce_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - /app/myenv  # Exclure le virtualenv du volume mount
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - ecommerce_network
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Exclure node_modules du volume mount
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true  # Pour le hot reload sur Windows
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - ecommerce_network
    stdin_open: true
    tty: true

  # Adminer pour l'administration de la base de données (optionnel)
  adminer:
    image: adminer:latest
    container_name: ecommerce_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - ecommerce_network

volumes:
  postgres_data:
  redis_data:

networks:
  ecommerce_network:
    driver: bridge